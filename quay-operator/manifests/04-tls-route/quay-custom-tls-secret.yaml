# Optional — supply a custom TLS certificate for the Quay Route.
# When using this, set tls: managed: false in quay-registry.yaml and add
# ssl.cert / ssl.key to the config bundle secret instead.
#
# Replace the placeholder values with base64-encoded PEM data.
apiVersion: v1
kind: Secret
metadata:
  name: quay-custom-tls
  namespace: quay-enterprise
type: kubernetes.io/tls
data:
  tls.crt: <BASE64_ENCODED_CERT>
  tls.key: <BASE64_ENCODED_KEY>
