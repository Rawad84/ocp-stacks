# ServiceAccount used by workloads that pull images from Quay.
# After creation, create a robot account in Quay and store its credentials
# as a dockerconfigjson secret, then link it to this SA:
#   oc secrets link quay-puller <robot-secret> --for=pull -n quay-enterprise
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quay-puller
  namespace: quay-enterprise
  labels:
    app.kubernetes.io/part-of: quay
