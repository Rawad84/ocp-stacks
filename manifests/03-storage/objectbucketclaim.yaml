# ObjectBucketClaim — NooBaa provisions a bucket and injects credentials into:
#   ConfigMap quay-bucket  → BUCKET_NAME, BUCKET_HOST, BUCKET_PORT
#   Secret    quay-bucket  → AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# The deploy script reads these to build the Quay config bundle.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: quay-bucket
  namespace: quay-enterprise
spec:
  generateBucketName: quay
  storageClassName: openshift-storage.noobaa.io
