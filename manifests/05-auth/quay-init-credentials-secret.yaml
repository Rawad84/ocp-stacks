# Superuser credentials used by the init Job and test scripts.
# Created by deploy.sh using values from scripts/env.sh — not applied manually.
# Template only: replace placeholders before applying directly.
apiVersion: v1
kind: Secret
metadata:
  name: quay-init-credentials
  namespace: quay-enterprise
type: Opaque
stringData:
  username: ${QUAY_SUPERUSER_USERNAME}
  password: ${QUAY_SUPERUSER_PASSWORD}
  email: ${QUAY_SUPERUSER_EMAIL}
